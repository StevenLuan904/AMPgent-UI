  - {metric_name: amp_read_log10_mic_um, role: qualification, maximum: 2.5, hard: false, missing_policy: fail, stages: [research, final], rationale: Independent generic MIC hypothesis.}
  - {metric_name: toxinpred3_ml_score, role: qualification, maximum: 0.50, hard: false, missing_policy: fail, stages: [research, final], rationale: Soft toxicity evidence with known conflict.}
  - {metric_name: macrel_hemolysis_probability, role: qualification, maximum: 0.50, hard: false, missing_policy: fail, stages: [research, final], rationale: Primary safety improvement objective; never a deletion gate.}
  - {metric_name: sequence_similarity, role: diversity, maximum: 0.75, hard: true, missing_policy: fail, stages: [proposal, research, final], rationale: Maintain sequence-space coverage.}
  - {metric_name: conditional_ppl, role: objective, direction: minimize, priority: 10, missing_policy: worst, stages: [proposal, research, final], rationale: Plausibility tie-breaker after soft qualification.}
