mutation_knowledge_cards:
  - item_id: v12-structure-audit-summary
    text: All four tested elites contacted the configured AceA pocket without cross-chain clashes, but pair-ipTM was only 0.158-0.167; treat target binding as weak evidence and do not over-optimize Rosetta REU.
    source_type: external_evidence
    source_locator: run:a53dd245-0fda-4f7c-8fba-eb08cf75faaa
  - item_id: v12-safety-activity-tradeoff
    text: GKVGAIVGRKARVHH led fixed-protocol Rosetta and predicted MIC, while KRVGAIVGNKVRVHH led AMP-likeness; both retained high Macrel hemolysis risk, so lower hemolysis is the primary lightweight improvement objective.
    source_type: external_evidence
    source_locator: sha256:39e60a95b7fd59fdd4b3b0dee61a7ac3fb0ba3677c233a1ffe251580c8545b08
  - item_id: v13-agent-prior-conservative-neighborhood
    text: Explore conservative one-to-three-residue neighborhoods around both leads and retain diverse controls; shared motifs are hypotheses, not fixed constraints.
    source_type: llm_internal_knowledge
    model_name: gpt-5
    model_revision: "2026-08-06"

