target:
  name: Escherichia coli K-12 isocitrate lyase AceA
  sequence: 
  organism: Escherichia coli K-12
  accession: P0A9G6
  source_database: UniProtKB/Swiss-Prot
  source_uri: https://rest.uniprot.org/uniprotkb/P0A9G6.fasta
  source_version: entry 145; sequence 1
  source_retrieved_at: 2026-07-31T00:00:00Z
  pocket_residues: [89, 91, 92, 93, 108, 157, 159, 184, 186, 193, 194, 195, 196, 197, 232, 287, 289, 317, 318, 319, 320, 321, 351, 352, 356]
peptide_lengths: [10, 12, 15]
candidates_per_length: 10
structure_top_k: 6
generations: 4
autoresearch_enabled: true
seed: 20260803
pepmlm_model: ChatterjeeLab/PepMLM-650M
search_regime: E1
pepmlm_de_novo_top_k: 10
pepmlm_mutation_top_k: 10
pepmlm_temperature: 1.35
boltz_method: boltz2
diffusion_samples: 1
boltz_seeds_per_candidate: 3
boltz_recycling_steps: 3
boltz_sampling_steps: 200
boltz_use_potentials: true
boltz_no_kernels: true
boltz_force_pocket: true
pocket_max_distance_angstrom: 8.0
use_msa_server: false
interface_contact_distance_angstrom: 5.0
interface_clash_distance_angstrom: 1.5
interface_min_pocket_contacts: 2
interface_min_seed_consistency: 0.67
interface_min_pair_iptm_median: 0.15
interface_pose_cluster_rmsd_angstrom: 4.0
interface_min_pose_cluster_fraction: 0.6666666666666666
maximum_sequence_similarity: 0.75
elite_parent_count: 4
mutation_children_per_parent: 5
mutation_count_min: 2
mutation_count_max: 6
exploration_candidates_per_length: 3
rosetta_enabled: true
rosetta_top_k: 1
exploratory_rosetta_slots: 1
rosetta_nstruct: 200
rosetta_parallel_decoys: 8
rosetta_pair_iptm_min: 0.15
rosetta_score_function: ref2015
affinity_evaluators: []

# Qualifications are pass/fail; objectives rank only candidates that passed;
# diversity is a coverage floor, not an unbounded objective. The conventional
# instability threshold is a versioned short-peptide proxy, not an assay claim.
metric_policy:
  - metric_name: instability_index
    role: qualification
    maximum: 40.0
    hard: true
    missing_policy: fail
    stages: [proposal, research, final]
    rationale: Conventional Guruprasad/Biopython intrinsic-instability qualification.
  - metric_name: maximum_identical_residue_run
    role: qualification
    maximum: 4
    hard: true
    missing_policy: fail
    stages: [proposal, research, final]
    rationale: Reject extreme low-complexity homopolymer-like peptide proposals.
  - metric_name: maximum_hydrophobic_run
    role: qualification
    maximum: 4
    hard: true
    missing_policy: fail
    stages: [proposal, research, final]
    rationale: Provisional aqueous-peptide aggregation and solubility guardrail.
  - metric_name: hydrophobic_fraction
    role: qualification
    maximum: 0.60
    hard: true
    missing_policy: fail
    stages: [proposal, research, final]
    rationale: Provisional task-specific developability window, not a stability optimum.
  - metric_name: sequence_similarity
    role: diversity
    maximum: 0.75
    hard: true
    missing_policy: fail
    stages: [proposal, research, final]
    rationale: Maintain a minimum amount of sequence-space coverage.
  - metric_name: interface_gate_pass
    role: qualification
    minimum: 1
    hard: true
    missing_policy: fail
    stages: [final]
    rationale: Structural consistency is required for a hit and cannot be offset by another metric.
  - metric_name: pocket_contact_consistency
    role: objective
    direction: maximize
    priority: 10
    missing_policy: worst
    stages: [research]
    rationale: Rank qualified parents by reproducible pocket engagement.
  - metric_name: boltz2_pair_iptm_median
    role: objective
    direction: maximize
    priority: 20
    missing_policy: worst
    stages: [research]
    rationale: Secondary structural-confidence objective within the qualified set.
  - metric_name: conditional_ppl
    role: objective
    direction: minimize
    priority: 30
    missing_policy: worst
    stages: [proposal, research]
    rationale: Language-model plausibility is a proposal objective and later tie-breaker.
  - metric_name: rosetta_dg_separated_reu
    role: objective
    direction: minimize
    priority: 10
    missing_policy: worst
    stages: [final]
    rationale: Relative same-protocol re-ranking proxy; never reported as experimental affinity.
