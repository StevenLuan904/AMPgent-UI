target:
  name: Escherichia coli K-12 isocitrate lyase AceA
  sequence: 
  organism: Escherichia coli K-12
  accession: P0A9G6
  source_database: UniProtKB/Swiss-Prot
  source_uri: https://rest.uniprot.org/uniprotkb/P0A9G6.fasta
  source_version: entry 145; sequence 1
  source_retrieved_at: 2026-07-31T00:00:00Z
  pocket_residues: [89, 91, 92, 93, 108, 157, 159, 184, 186, 193, 194, 195, 196, 197, 232, 287, 289, 317, 318, 319, 320, 321, 351, 352, 356]
peptide_lengths: [10, 12, 15]
candidates_per_length: 14
generations: 4
autoresearch_enabled: true
seed: 20260806
pepmlm_model: ChatterjeeLab/PepMLM-650M
search_regime: E1
pepmlm_de_novo_top_k: 10
pepmlm_mutation_top_k: 10
pepmlm_temperature: 1.35
mutation_children_per_parent: 5
mutation_count_min: 2
mutation_count_max: 6
exploration_candidates_per_length: 4
maximum_sequence_similarity: 0.75
elite_parent_count: 4

structure_protocol: diagnostic_fast
structure_top_k: 4
search_structure_comprehensive_count: 2
search_structure_diversity_count: 2
final_structure_candidate_count: 8
boltz_method: boltz2
diffusion_samples: 1
boltz_seeds_per_candidate: 1
boltz_recycling_steps: 3
boltz_sampling_steps: 200
boltz_use_potentials: true
boltz_no_kernels: true
boltz_force_pocket: true
use_msa_server: false
pocket_max_distance_angstrom: 8.0
interface_contact_distance_angstrom: 5.0
interface_clash_distance_angstrom: 1.5
interface_min_pocket_contacts: 2
interface_min_pair_iptm_median: 0.15
severe_structure_clash_count: 25

# The normal search lane remains diagnostic-only. After all generations, a
# all naturally produced candidates that pass the non-compensatory qualifications
# and diversity filter enter the single-seed Boltz + 8-decoy Rosetta shadow lane.
# The candidate limit is only a safety cap; the search never expands to fill it.
# 200 complete, protocol-compatible rows is a cross-run stage-report threshold.
# Every complex is prepacked once; InterfaceAnalyzer uses pack_input=false and
# pack_separated=false.
rosetta_enabled: false
rosetta_top_k: 3
rosetta_nstruct: 8
rosetta_parallel_decoys: 8
bulk_rosetta_all_qualified: true
bulk_rosetta_candidate_limit: 250
bulk_csv_report_threshold: 200
bulk_evaluation_concurrency: 4
rosetta_score_function: ref2015
exploratory_rosetta_slots: 0
affinity_evaluators: []

optional_metrics:
  # Built-in, deterministic descriptors. These are recorded during research and
  # final stages but do not alter the established qualification/objective policy.
  - name: physicochemical_developability
    enabled: true
    trust: descriptor
    stages: [research, final]
    failure_policy: record_unavailable
    parameters:
      ph: 7.4
      c_terminal_amidated: false
      hydrophobic_moment_angle: 100
  # External predictors are deliberately final-stage soft evidence. Each stays
  # unavailable unless a deployment explicitly enables a source-, weight-,
  # license-, and environment-locked adapter in its separate runtime registry.
  - name: hemolysis_risk
    enabled: true
    trust: soft
    stages: [final]
    failure_policy: record_unavailable
  - name: toxicity_risk
    enabled: true
    trust: soft
    stages: [final]
    failure_policy: record_unavailable
  - name: mic_potency
    enabled: true
    trust: soft
    stages: [final]
    failure_policy: record_unavailable
  - name: amp_likeness
    enabled: true
    trust: soft
    stages: [final]
    failure_policy: record_unavailable
  # A reference snapshot is required before novelty values are comparable.
  - name: sequence_novelty
    enabled: false
    trust: descriptor
    stages: [final]
    failure_policy: record_unavailable
  - name: serum_half_life
    enabled: true
    trust: shadow
    stages: [final]
    failure_policy: record_unavailable
  - name: aggregation_apr
    enabled: true
    trust: shadow
    stages: [final]
    failure_policy: record_unavailable

metric_policy:
  - metric_name: instability_index
    role: qualification
    maximum: 40.0
    hard: true
    missing_policy: fail
    stages: [proposal, research, final]
    rationale: Guruprasad/Biopython intrinsic-instability qualification.
  - metric_name: maximum_identical_residue_run
    role: qualification
    maximum: 4
    hard: true
    missing_policy: fail
    stages: [proposal, research, final]
    rationale: Reject extreme low-complexity proposals.
  - metric_name: maximum_hydrophobic_run
    role: qualification
    maximum: 4
    hard: true
    missing_policy: fail
    stages: [proposal, research, final]
    rationale: Provisional aggregation and solubility guardrail.
  - metric_name: hydrophobic_fraction
    role: qualification
    maximum: 0.60
    hard: true
    missing_policy: fail
    stages: [proposal, research, final]
    rationale: Provisional task-specific developability window.
  - metric_name: sequence_similarity
    role: diversity
    maximum: 0.75
    hard: true
    missing_policy: fail
    stages: [proposal, research, final]
    rationale: Maintain sequence-space coverage.
  - metric_name: conditional_ppl
    role: objective
    direction: minimize
    priority: 10
    missing_policy: worst
    stages: [proposal, research, final]
    rationale: Language-model plausibility; structure remains diagnostic.
  - metric_name: structure_available
    role: diagnostic
    hard: false
    missing_policy: ignore
    stages: [research, final]
    rationale: Availability is evidence metadata, never a sequence qualification.
  - metric_name: boltz2_pair_iptm_median
    role: diagnostic
    hard: false
    missing_policy: ignore
    stages: [research, final]
    rationale: Single-seed predicted-complex confidence diagnostic.
  - metric_name: pocket_contact_count
    role: diagnostic
    hard: false
    missing_policy: ignore
    stages: [research, final]
    rationale: Single-pose pocket-contact diagnostic.
  - metric_name: interface_clash_count
    role: diagnostic
    hard: false
    missing_policy: ignore
    stages: [research, final]
    rationale: Coordinate sanity and conflict diagnostic.
  - metric_name: rosetta_dg_separated_reu
    role: diagnostic
    hard: false
    missing_policy: ignore
    stages: [final]
    rationale: Eight-decoy local-energy shadow metric without separated-state repacking.
