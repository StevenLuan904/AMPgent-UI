mutation_knowledge_cards:
  - item_id: v18-high-precision-ensemble-audit
    text: WKL had median pair-ipTM 0.2075 with four of five seeds above 0.20, complete pocket-contact consistency, no clashes, and a 2/5 pose cluster. RKL had median 0.1703 and a 1/5 pose cluster. Favor conservative WKL neighborhoods, but do not treat either pose as established binding.
    source_type: external_evidence
    source_locator: sha256:83c8fc75538723ee30cf5f238a451af6864e1a4903bb9ea9625f5a98124fcfd7
  - item_id: v18-high-precision-rosetta-audit
    text: In the same 200-decoy adapter-v3 protocol, WKL had primary dG -54.0 REU, interface score -62.1, nine interface hydrogen bonds, and BSA 2692, while RKL had -47.9, -46.5, four, and 2357. These are relative computational evidence only; the absolute best RKL decoy was slightly lower.
    source_type: external_evidence
    source_locator: sha256:5252ef301a3fcde68fdcc4081400f2874b896e3ff4636ac90b1acf77baca14db
  - item_id: v19-agent-prior-pose-stability-search
    text: Explore conservative one-to-three-residue neighborhoods around WKL while retaining de novo controls. Prioritize multi-model AMP, MIC, toxicity, hemolysis, physicochemical plausibility, and diversity before escalating only mature representatives to multi-seed structure testing.
    source_type: llm_internal_knowledge
    model_name: gpt-5
    model_revision: "2026-08-07"

