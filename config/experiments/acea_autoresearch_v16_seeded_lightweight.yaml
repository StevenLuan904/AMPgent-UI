mutation_knowledge_cards:
  - item_id: v15-multiseed-binding-audit
    text: Across three independent Boltz seeds, DKL, DKLL, and GRV had median pair-ipTM 0.171, 0.187, and 0.183. All contacted the configured pocket without clashes, but only DKLL clustered in 2/3 poses; all structure support remained weak. Treat pocket binding as a hypothesis, not a demonstrated interaction.
    source_type: external_evidence
    source_locator: sha256:3fc826a30fa65653e6605f1a87ced917faf38ce02b8bd2b59853d64afcccd59f
  - item_id: v15-rosetta-representative-audit
    text: Representative fixed 8-decoy adapter-v3 Rosetta dG was -45.0 REU for DKLL, -18.1 for DKL, and -7.9 for GRV. These values are same-protocol relative evidence only and changed substantially with the selected Boltz pose.
    source_type: external_evidence
    source_locator: sha256:f417819288516f14925cab2f2c158274430dbcce1686bce06a8eafffb0bdc5f1
  - item_id: v16-agent-prior-conservative-recovery
    text: Explore conservative one-to-three-residue neighborhoods around the reproducible-pose and activity/safety parents, retain de novo controls, and prefer multi-model AMP/MIC/safety balance before returning a diverse elite set to multi-seed structure validation.
    source_type: llm_internal_knowledge
    model_name: gpt-5
    model_revision: "2026-08-07"

