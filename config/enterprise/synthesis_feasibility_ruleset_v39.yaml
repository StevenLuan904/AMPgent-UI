schema_version: ampgent.synthesis-feasibility-rules.1
ruleset_id: ampgent_sequence_only_spps_review_v39_20260820
endpoint_semantics: sequence_only_manual_review_triage_for_standard_fmoc_spps
applicability_domain:
  canonical_amino_acids_only: true
  minimum_length: 8
  maximum_length: 30
  unmodified_linear_peptide_only: true
review_thresholds:
  hydrophobic_alphabet: AVILMFWY
  identical_run_review_at: 5
  hydrophobic_run_review_at: 5
  hydrophobic_fraction_review_at: 0.50
  cysteine_count_review_at: 2
  oxidation_sensitive_residues: CMW
  oxidation_sensitive_count_review_at: 3
  aspartimide_review_motifs: [DG, DN, DS]
  n_terminal_glutamine_review: true
threshold_provenance:
  policy: conservative_internal_preregistered_review_triggers_not_claimed_as_published_cutoffs
  external_method_sources:
    - doi: 10.1038/nprot.2007.454
      title: Solid-phase peptide synthesis from standard procedures to difficult sequences
      role: independent_method_and_failure_mode_context
    - doi: 10.1002/psc.2836
      title: Advances in Fmoc solid-phase peptide synthesis
      role: independent_method_and_side_reaction_context
decision_policy:
  hard_rejection_forbidden: true
  activity_or_safety_inference_forbidden: true
  any_flag_action: manual_synthesis_chemist_review
  no_flag_action: routine_sequence_only_spps_not_a_yield_guarantee
limitations:
  - Sequence-only heuristic; does not predict isolated yield, purity, cost, or successful scale-up.
  - Does not model resin, coupling reagent, protecting groups, termini, modifications, or purification.
  - Internal thresholds are conservative review triggers and are not published universal cutoffs.
  - A routine label cannot establish solubility, stability, antimicrobial activity, or safety.
