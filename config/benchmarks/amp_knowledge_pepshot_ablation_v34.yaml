factorial_design:
  factors:
    verified_knowledge_context: ["off", "on"]
    PepShot_review: ["off", "on"]
  arms:
    - {name: baseline, verified_knowledge_context: "off", PepShot_review: "off"}
    - {name: cards_only, verified_knowledge_context: "on", PepShot_review: "off"}
    - {name: pepshot_only, verified_knowledge_context: "off", PepShot_review: "on"}
    - {name: cards_and_pepshot, verified_knowledge_context: "on", PepShot_review: "on"}
  repeated_block: every_parent_runs_all_four_arms
  arm_order: deterministic_sha256_permutation
  arm_order_salt: amp-knowledge-pepshot-v34-order-v1
  cross_arm_memory_forbidden: true
  opaque_arm_labels_for_adjudication: true
  assignment_reveal_after_locked_adjudication: true

