independent_evaluation:
  evaluation_lane_blinded_to_arm_labels: true
  intervention_agents_blinded_to_holdout_adjudication: true
  primary_endpoints:
    - {name: confirmed_novel_nondominated_yield_per_parent, direction: maximize, family: discovery}
    - {name: structural_conflict_interception_recall, direction: maximize, family: structural_safety}
    - {name: invalid_or_unsupported_edit_rate, direction: minimize, family: decision_quality}
  secondary_endpoints:
    - {name: repeated_historical_failure_avoidance_rate, direction: maximize}
    - {name: structural_conflict_interception_precision, direction: maximize}
    - {name: cross_seed_decision_consistency, direction: maximize}
    - {name: mechanism_lane_coverage, direction: maximize}
    - {name: tool_calls_per_retained_candidate, direction: minimize}
    - {name: wall_clock_seconds_per_retained_candidate, direction: minimize}
  holdout_confirmation:
    structural: deterministic_coordinate_audit_plus_independent_Boltz_seeds_and_same_protocol_Rosetta
    discovery: frozen_membrane_AMP_MIC_risk_and_structure_families_with_leave_one_model_out
    historical_failure: frozen_pre_v34_failure_taxonomy_only
  intervention_outputs_cannot_be_sole_validation_endpoint: true
  weighted_total_score_forbidden: true
  single_soft_model_promotion_forbidden: true

analysis_contract:
  unit: parent
  paired_within_parent: true
  report_each_arm_separately: true
  required_contrasts:
    - knowledge_main_effect
    - PepShot_main_effect
    - knowledge_by_PepShot_interaction
    - cards_only_vs_baseline
    - pepshot_only_vs_baseline
    - cards_and_pepshot_vs_baseline
  uncertainty: parent_cluster_bootstrap_with_frozen_seed
  bootstrap_seed: 20270134
  bootstrap_replicates: 10000
  multiplicity_policy: endpoint_families_reported_separately_no_binary_global_winner
  promotion_rule:
    minimum_requirement: at_least_one_primary_practical_endpoint_improves_without_margin_exceeding_degradation_on_other_primary_endpoints
    practical_margins_must_be_frozen_before_execution: true
    current_margin_status: frozen_before_execution
    endpoint_margins:
      confirmed_novel_nondominated_yield_per_parent:
        improvement: 0.25
        maximum_allowed_degradation: 0.10
        unit: confirmed_candidates_per_parent
        interpretation: six_additional_confirmed_discoveries_across_24_parents_is_practically_material
      structural_conflict_interception_recall:
        improvement: 0.10
        maximum_allowed_degradation: 0.05
        unit: absolute_fraction
      invalid_or_unsupported_edit_rate:
        improvement: 0.10
        maximum_allowed_degradation: 0.05
        unit: absolute_fraction
    confidence_interval_requirement: parent_cluster_bootstrap_95_percent_interval_reported_not_used_as_single_binary_gate
    allowed_verdicts:
      - promote_general
      - retain_context_specific
      - no_demonstrated_benefit
      - harmful_or_unreliable
      - inconclusive

