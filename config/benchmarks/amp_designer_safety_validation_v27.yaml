nonformal_smoke:
  status: not_run
  attempt_count: 2
  run_in_two_fresh_processes: true
  sequences:
    - sequence: ACDEFGHIKLMNPQRSTVWY
      sequence_sha256: 5a52efc76a4a4ceb3c992ff17426b3545634646080bb6acec132c47c278c9846
    - sequence: KKLLWWRRAACCDD
      sequence_sha256: 0d12e60103351fa43df6fa2b510bd5b44983eed770d6dc934ea353938079b2ca
  ordered_sequence_list_sha256: 9578af2ffbb135b49ebb95ef8740a1c2234771a83c35a28164b5a8fc1ce2e362
  canonicalization:
    json_sort_keys: true
    json_separators: [",", ":"]
    trailing_newline: true
    hc50_transform: exp(-raw_prediction)
    hc50_round_decimal_places: 3
    classification_score_extra_rounding: forbidden
  pass_requirements:
    - both fresh processes exit successfully without warnings
    - static model hashes and pickle global allowlist match
    - feature names, order, counts, and hashes match
    - all classification and transformed HC50 outputs are finite
    - canonical output bytes and SHA-256 are exactly equal
  failure_action: terminal_fail_closed_no_rerun

formal_execution:
  status: forbidden_until_smoke_passes
  allowed_run_count_after_ready: 1
  full_300_row_cohort_required: true
  filtering_reordering_deduplication_omission_forbidden: true
  one_to_one_output_required: true
  transformed_hc50_only: true
  raw_hc50_label_forbidden: true

evidence_scope:
  evidence_class: independent_model_family_soft_safety_validation
  allowed_claim: external HemoPI2 agreement or disagreement on predicted hemolysis risk
  forbidden_claims:
    - experimental safety or hemolysis
    - AceA binding or affinity
    - global generator winner
    - candidate selection using v27 outputs
    - rewrite or rescue of v26

fail_closed:
  - Stop if any inherited archive, model, environment, feature, or allowlist hash changes.
  - Stop if the fixed smoke sequences or their order changes.
  - Stop if thread limits are not active before numerical libraries import.
  - Stop if the upstream exp(-raw) then round(3) HC50 contract is not applied exactly.
  - Stop if repeated smoke canonical bytes differ for any reason.
  - Stop before formal access unless smoke status is explicitly passed_ready.
  - Stop if any formal input or output row is selected, reordered, duplicated, or omitted.
  - Stop if results are presented as experimental, binding, affinity, or winner evidence.
