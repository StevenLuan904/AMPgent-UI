scientific_contract:
  raw_outputs_frozen_before_metrics: true
  no_score_based_refill: true
  generator_internal_scores_not_used_for_selection: true
  pepmlm_not_used_to_select_winner: true
  no_binding_or_affinity_claim: true

winner_rule_notes:
  - No weighted composite score is permitted.
  - Compare qualification and safety first, then activity and MIC profiles by generator-seed medians.
  - Use Pareto dominance; unresolved near-equality is a tie, not a forced rank.
  - Select two generators for deeper iteration only after all three seeds and all admitted metrics complete.
