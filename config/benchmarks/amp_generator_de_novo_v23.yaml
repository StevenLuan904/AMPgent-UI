    paper_uri: https://www.nature.com/articles/s41467-023-42434-9
    source_uri: https://github.com/amirpandi/Deep_AMP
    source_revision: a44465f704f3224120fd3b1c0bc2d5823a1181c8
    license: MIT
    generation_mode: de_novo
    internal_score_filtering_enabled: false
    weights:
      - path: VAE_v2_decoder/keras_metadata.pb
        size_bytes: 25041
        sha256: 5b2f6e805771e55ca7a569e2812dc59b342b74180343e309f79beaed766d09a9
