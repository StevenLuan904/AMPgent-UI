benchmark_id: amp_generator_de_novo_v23
version: v23.0.0
execution_status: completed
track: de_novo

# This is a short-AMP benchmark aligned to the skin AMP project. Models are not
# allowed to refill after invalid, duplicate, or out-of-range raw proposals.
seeds: [20260809, 20260810, 20260811]
raw_proposal_budget_per_seed: 1000
selected_valid_unique_per_seed: 100
minimum_length: 10
maximum_length: 25
canonical_amino_acids: ACDEFGHIKLMNPQRSTVWY
selection_rule: raw_order_first_k_valid_unique
missing_policy: retain_shortfall_no_refill
ranking_method: pareto_then_lexicographic
bootstrap_unit: generator_seed
structure_enabled: false

generators:
  - generator_id: hydramp
    display_name: HydrAMP
    paper_title: HydrAMP - a deep generative model for antimicrobial peptide discovery
    venue: Nature Communications
    publication_year: 2023
    paper_uri: https://www.nature.com/articles/s41467-023-36994-z
    source_uri: https://github.com/szczurek-lab/hydramp
    source_revision: 6590d2f4c2963f25d30669052a4c4a857e0e7279
    license: MIT
    generation_mode: de_novo
    internal_score_filtering_enabled: false
    weights:
      - path: zenodo-7420278/models.zip
        size_bytes: 437523333
        upstream_digest: md5:31ffa0b335ad63b8d863129f698bdc2f
        sha256: c2bf137ebe546fee8750b8c174486f1a9804e21a394a389a4f83d0bc6d743420
    limitations:
      - The released model was trained for peptides shorter than 25 residues.
      - Its internal AMP and MIC classifiers are recorded but disabled for raw-cohort selection.
      - TensorFlow 2.2-era dependencies require an isolated legacy environment.

