  paired_median_toxinpred3_ml_margin: 0.05
development_decision_rule: safety_gate_then_pareto_activity_mic_then_lower_temperature_tiebreak
confirmation_rule:
  bootstrap_unit: parent
  confidence_level: 0.9
  required_signals:
    - lower_ci_paired_delta_macrel_amp_probability_gt_0
    - upper_ci_paired_delta_mean_log10_mic_lt_0
    - upper_ci_paired_delta_macrel_hemolysis_le_0_05
    - upper_ci_paired_delta_toxinpred3_ml_le_0_05
  binding_claim_allowed: false

fail_closed_conditions:
  - any_internal_amp_or_mic_classifier_call
  - model_or_weight_sha_mismatch
  - parent_sequence_or_sha_mismatch
  - seed_temperature_or_raw_budget_mismatch
  - any_essential_metric_unavailable
  - any_nonfinite_essential_metric
  - valid_unique_yield_below_0_5_in_any_cell
  - confirmation_temperature_not_frozen_before_confirmation_seed

scientific_contract:
  v23_outputs_immutable: true
