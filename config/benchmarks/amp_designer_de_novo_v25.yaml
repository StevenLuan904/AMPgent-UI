promotion_rule_notes:
  - Compare append-only against frozen v23 results; never rewrite the v23 scorecard.
  - Use generator-seed medians and Pareto dominance without a weighted composite score.
  - Promote only if AMP-Designer is not dominated by all qualified v23 generators across essential endpoints.
  - Crossed or near-equal profiles remain unresolved rather than receiving a forced rank.

fail_closed:
  - Stop on source revision, Zenodo record, file size, upstream digest, or post-download SHA-256 mismatch.
  - Stop if the isolated dependency lock, RNG injection, sampling settings, or fixed batch partition differs.
  - Stop if a repeated smoke seed does not produce the same ordered raw-output SHA-256.
  - Stop if any seed does not produce exactly 1000 ordered raw records or a generation exception is swallowed.
  - Stop if any internal regressor or any internal or external score enters generation, filtering, refill, or ordering.
  - Stop if raw cohorts are not frozen before metrics or any essential metric is missing, version-drifted, or non-finite.
