decision_scope:
  evidence_class: independent_model_family_soft_safety_validation
  allowed_claim: external_model_agreement_or_disagreement_on_predicted_hemolysis_risk
  forbidden_claims:
    - experimentally safe or hemolytic
    - AceA binding or affinity
    - global generator winner
    - candidate selection within v26

fail_closed:
  - Stop before extraction on Zenodo record, archive name, size, or upstream MD5 mismatch.
  - Stop before deserialization until archive SHA-256 and extracted inventory SHA-256 are frozen.
  - Stop if static inventory reveals undeclared executable hooks, unexpected model files, path traversal, links, or archive members outside the isolated workspace.
  - Stop unless the isolated environment is dependency-locked and inference networking is disabled.
  - Stop if the frozen input SHA-256, row count, order, sequence, or per-row sequence SHA-256 differs.
  - Stop if any input row is filtered, reordered, replaced, deduplicated, or omitted.
  - Stop if classification or HC50 output is missing, non-finite, duplicated, or not one-to-one with all 300 inputs.
  - Stop if ConsAMPHemo or any other unlicensed validator is introduced.
  - Stop if outputs are used as experimental evidence, binding evidence, or to rewrite v25.
