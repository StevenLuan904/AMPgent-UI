metric_definition:
  primary_metric:
    name: target_specific_delta_nll
    version: v22_stratified
    formula: 0.5 * median(unrelated_control_nlls) + 0.5 * median(composition_shuffle_control_nlls) - AceA_nll
    direction: higher_values_rank_as_more_AceA_conditioned_within_this_protocol
  secondary_metric:
    name: pooled_v21_compatible_delta_nll
    formula: median(all_control_target_nlls) - AceA_nll
    secondary_only: true
  no_score_based_adaptation: Do not add, remove, replace, or rerun controls or candidates based on observed proxy scores; any scientific change requires a new versioned manifest.
  required_consumer_function: summarize_stratified_target_specific_delta_nll

stability_diagnostics:
  diagnostic_only: true
  do_not_change_primary_metric: true
  leave_one_decoy_out:
    compare_to_full_panel: Spearman rank correlation across all 14 candidates
    minimum_acceptable_spearman_rho: 0.90
    maximum_acceptable_candidate_rank_swing: 2
  control_type_dependence:
    compare_rankings: unrelated-only delta NLL versus composition-shuffle-only delta NLL
    minimum_acceptable_spearman_rho: 0.80
    require_same_sign_for_each_candidate: true
  paired_candidate_controls:
    pairs: 6
    report_each_pair_without_statistical_generalization: true
  threshold_interpretation: Failure preserves the run as diagnostic evidence but forbids any evidence upgrade or reliable binding claim.

fail_closed_stop_conditions:
  - code commit or content-addressed release archive differs from execution_release
  - PepMLM model revision or weights SHA256 differs from model_release
  - UniProt release, exact query, returned row count, canonical byte count, or candidate-pool SHA256 differs
  - any frozen decoy accession, canonical sequence, sequence version, sequence SHA256, or selection hash differs
  - any selected decoy shares AceA UniRef50, Pfam, or InterPro membership
  - target panel does not contain exactly one primary, four unrelated controls, and eight composition shuffles
  - any target sequence SHA256 or target_panel_sha256 differs
  - any composition shuffle is not composition-identical to AceA or any target sequence is duplicated
  - candidate panel is not exactly the ten v21 candidates plus the four preregistered v20d scrambles
  - any candidate sequence SHA256, candidate_panel_sha256, source identity, scramble seed derivation, composition match, or uniqueness check differs
  - any target control_type is unknown, any control stratum has fewer than two members, or any conditional NLL is non-finite
  - the scoring CLI does not explicitly select summarize_stratified_target_specific_delta_nll and persist metric_version v22_stratified
  - an active run exists or the designated GPU is occupied by an unrelated process at deployment or submission time
  - any attempt is made to inspect proxy scores before the panel and manifest are frozen

execution_notes:
  remote_run_authorized_by_this_manifest: false
  score_inspection_during_preregistration: prohibited
  execution_status: blocked_fail_closed
  cli_compatibility: submit-sequence-binding-proxy-calibration consumes target_panel and candidates but ignores the additional audit metadata; it computes the target panel digest from normalized target fields and does not currently enforce candidate_panel_sha256.
  blocking_consumer_gap: At code commit 9b95b5964607e162e7323bf42e8d3b966e2eb10f, pepmlm_target_proxy_cli still calls the pooled v21 summarizer and activities still label and persist the pooled v21 definition. The v22 stratified summarizer exists but is not selected by the submission path. Do not submit this manifest until a separately reviewed versioned code change closes this gap.
