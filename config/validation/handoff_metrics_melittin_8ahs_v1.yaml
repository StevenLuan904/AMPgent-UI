limitations:
  - One positive-control peptide validates plumbing and qualitative direction, not calibration.
  - The calmodulin-bound pose is not melittin's bacterial-membrane mechanism of action.
  - Assay values are context-specific and must not be treated as universal labels.
  - External adapters are evaluated only when their deployment-local source, weights, license, and runtime are locked.
  - PDB ATOM records omit melittin Gly1 and Gln25-Gln26; metrics use the deposited full sequence.
